services:
  - type: web
    name: slk-miniapp
    runtime: python
    branch: claude-kevin-king
    rootDir: webapp
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "1410229777"
      - key: CRON_SECRET  # hourly tick: cron-job.org calls /cron/tick?key=<this>; see webapp/README.md
        sync: false
      - key: GH_DISPATCH_TOKEN  # fine-grained GitHub token, repo awujo/practicing only, Actions: read and write
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET  # bot webhook /telegram/webhook (/terms); see webapp/README.md
        sync: false

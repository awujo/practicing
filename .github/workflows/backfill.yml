name: SLK candle backfill
# One-time (or after the candle cache was evicted): fill the H1 candle store (slk/store.py) for all pairs and save
# it in the Actions cache that the hourly live job and the backtest restore. Run: Actions > SLK candle backfill.
on:
  push:  # runs once when this file changes (manual runs need it on the default branch)
    branches: [claude-kevin-king]
    paths: [".github/workflows/backfill.yml"]
  workflow_dispatch:
    inputs:
      start: {description: "First year (2018 = enough for the backtest too)", default: "2018"}
      pairs: {description: "Comma list, empty = all 28", default: ""}
permissions:
  contents: read
concurrency: {group: slk-live, cancel-in-progress: false}  # never at the same time as the live job
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLK_STORE: data/store
      IN_START: ${{ inputs.start || '2018' }}
      IN_PAIRS: ${{ inputs.pairs }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1410229777' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/backfill.yml
      - run: pip install -q pandas
      - name: Restore candle store
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: candles-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            candles-v2-
            candles-live-
      - name: Backfill
        run: |
          python -m slk.store --start "$IN_START" --pairs "$IN_PAIRS" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh data/store | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Is the candle store complete?
        id: chk
        if: always()
        run: |
          if python -m slk.store --check --start 2018; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Save candle store
        if: always() && steps.chk.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/store
          key: candles-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Telegram alert on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -sS -o /dev/null -w "telegram http %{http_code}\n" --max-time 20 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=SLK candle backfill FAILED $(date -u '+%Y-%m-%d %H:%M') UTC. Log: ${RUN_URL}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true

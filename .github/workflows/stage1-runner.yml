name: Stage 1 skeleton runner

# Long-running pattern: external timer (or a previous run) fires workflow_dispatch.
# `planned_at` = the time the timer intended this run to start; the runner logs how
# late it actually started -> that is our real cron-drift measurement.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Heartbeat minutes for this run (keep < 360)"
        required: false
        default: "2"
      planned_at:
        description: "ISO UTC time the dispatcher fired (for delay measurement)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pymysql
      - name: Run stage 1 skeleton
        env:
          DB_URL: ${{ secrets.DB_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python stage1/run.py \
            --minutes "${{ github.event.inputs.minutes || '2' }}" \
            --planned "${{ github.event.inputs.planned_at }}"

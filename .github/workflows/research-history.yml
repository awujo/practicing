name: SLK expanded historical scenarios
on:
  workflow_dispatch:
    inputs:
      pairs: {description: "CSV from the 28 frozen pairs; empty = all", default: ""}
      publish: {description: "Explicitly publish results into MySQL after study (uses user database space)", type: boolean, default: false}
permissions:
  contents: read
  actions: read
concurrency:
  group: slk-research-history
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pairs: ${{ steps.plan.outputs.pairs }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: plan
        env:
          PAIRS_REQUESTED: ${{ inputs.pairs }}
        run: |
          python - <<'PY'
          import json, os, ast
          from pathlib import Path
          tree=ast.parse(Path('slk/backtest.py').read_text())
          node=next(n.value for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='PAIRS' for t in n.targets))
          pairs=ast.literal_eval(node.func.value).split()
          wanted=[p.strip().upper() for p in os.environ['PAIRS_REQUESTED'].split(',') if p.strip()] or pairs
          if len(wanted)!=len(set(wanted)) or not set(wanted)<=set(pairs):raise ValueError('Choose distinct frozen FX pairs')
          runs=[39255962764,39261223754,39261650880,39262056504,39262526990,39262964414,39263389187]
          jobs=[{'pair':p,'source':str(runs[pairs.index(p)//4])} for p in wanted]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':jobs})+'\n');f.write('pairs='+json.dumps(wanted)+'\n')
          PY
  study:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas==2.2.3 pytest==8.3.5
      - run: python -m pytest -q tests/test_research_scenarios.py tests/test_research_replay.py tests/test_research_entries.py tests/test_research_history.py
      - uses: actions/download-artifact@v4
        with:
          name: research-input-${{ matrix.source }}
          run-id: ${{ matrix.source }}
          github-token: ${{ github.token }}
          path: research-input
      - name: Native history replay and expanded scenario studies
        env:
          STUDY_PAIR: ${{ matrix.pair }}
        run: python -m slk.research_history --input research-input --pair "$STUDY_PAIR" --out "history-results/$STUDY_PAIR"
      - name: Compress bounded per-pair archive
        if: always()
        env:
          STUDY_PAIR: ${{ matrix.pair }}
        run: |
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          pair=os.environ['STUDY_PAIR'];root=Path('history-results')/pair
          if not root.exists():raise SystemExit('No pair output')
          with zipfile.ZipFile(pair+'.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():z.write(p,p.relative_to('history-results'))
          if Path(pair+'.zip').stat().st_size>8*1024**2:
              Path(pair+'.zip').unlink();raise SystemExit('Compressed pair output exceeded 8 MiB; not uploading')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-${{ matrix.pair }}-${{ github.run_id }}
          path: ${{ matrix.pair }}.zip
          retention-days: 7
  finalize:
    needs: [plan, study]
    if: ${{ !cancelled() && inputs.publish && needs.study.result == 'success' }}
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start short resumable finalization workflows
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.run_id }}
          EXPECTED_PAIRS: ${{ needs.plan.outputs.pairs }}
        run: gh workflow run research-finalize.yml --repo "$GITHUB_REPOSITORY" --ref claude-kevin-king -f source_run="$SOURCE_RUN" -f expected_pairs="$EXPECTED_PAIRS"

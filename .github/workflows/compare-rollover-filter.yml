name: Compare rollover-window entry filter

# TEMPORARY, one-off A/B comparison -- not meant to stay in the repo long
# term (matches this project's established pattern: comparison tooling
# gets removed once results are captured, see PROJECT_HISTORY.md/
# OPERATIONS_LOG.md for prior examples).
#
# Confirmed live 2026-08-31: a GBPAUD entry at 22:00 UTC filled 54 points
# worse than requested, turning $1,000 of intended risk into a $1,530.32
# realized loss. STRATEGY.md Section 8 already says to avoid trading in
# this window ("spread widens sharply around session rollover"). Before
# wiring run_backtest()'s new avoid_rollover_entries flag into the live
# bot, this runs the full 2025-2026 backtest across all 25 live
# instruments x both entry styles, with and without the filter, and
# reports the difference in total R / win rate / trade count so the
# decision to enable it live is based on real numbers, not just the one
# incident that prompted it.

on:
  workflow_dispatch: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backtest/data_pipeline/requirements.txt

      - name: Download latest data cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-latest --pattern 'backtest-data.tar.gz' --dir /tmp
          mkdir -p backtest/data
          tar -xzf /tmp/backtest-data.tar.gz -C backtest/
          echo "Restored $(find backtest/data -name '*.csv' | wc -l) cached data files."

      - name: Run the A/B comparison
        run: |
          python3 - <<'PYEOF'
          import pandas as pd
          from backtest.engine.runner import run_backtest
          from backtest.engine.trade_log import summarize

          INSTRUMENTS = [
              "EURUSD", "GBPUSD", "USDJPY", "USDCHF", "USDCAD", "AUDUSD", "NZDUSD",
              "EURGBP", "EURJPY", "EURCHF", "EURCAD", "EURNZD", "GBPJPY", "GBPCHF",
              "GBPCAD", "GBPNZD", "GBPAUD", "AUDCAD", "AUDJPY", "CHFJPY",
              "XAUUSD", "XAGUSD", "US30", "NAS100", "JP225",
          ]
          STYLES = ["conservative", "aggressive"]
          START = pd.Timestamp("2025-01-01", tz="UTC")
          END = pd.Timestamp("2026-12-31T23:59:59", tz="UTC")

          def run_all(avoid_rollover):
              all_records = []
              for instrument in INSTRUMENTS:
                  for style in STYLES:
                      try:
                          records = run_backtest(
                              instrument, style, source="dukascopy",
                              start_date=START, end_date=END,
                              avoid_rollover_entries=avoid_rollover,
                          )
                      except Exception as exc:
                          print(f"  [skip] {instrument}/{style}: {exc}")
                          continue
                      all_records.extend(records)
              return all_records

          print("Running WITHOUT the rollover filter (current default)...")
          baseline = run_all(False)
          print("Running WITH the rollover filter (avoid_rollover_entries=True)...")
          filtered = run_all(True)

          base_stats = summarize(baseline)
          filt_stats = summarize(filtered)

          removed = [
              r for r in baseline
              if r.entry_time is not None and 21 <= r.entry_time.hour < 23
          ]

          print()
          print("=" * 70)
          print(f"{'':30s} {'WITHOUT filter':>18s} {'WITH filter':>18s}")
          print(f"{'total trades':30s} {base_stats['total_trades']:>18d} {filt_stats['total_trades']:>18d}")
          print(f"{'closed trades':30s} {base_stats['closed_trades']:>18d} {filt_stats['closed_trades']:>18d}")
          print(f"{'wins':30s} {base_stats['wins']:>18d} {filt_stats['wins']:>18d}")
          wr_b = f"{base_stats['win_rate']*100:.1f}%" if base_stats['win_rate'] is not None else "n/a"
          wr_f = f"{filt_stats['win_rate']*100:.1f}%" if filt_stats['win_rate'] is not None else "n/a"
          print(f"{'win rate':30s} {wr_b:>18s} {wr_f:>18s}")
          print(f"{'total R':30s} {base_stats['total_r']:>18.1f} {filt_stats['total_r']:>18.1f}")
          avg_b = f"{base_stats['avg_r']:.3f}" if base_stats['avg_r'] is not None else "n/a"
          avg_f = f"{filt_stats['avg_r']:.3f}" if filt_stats['avg_r'] is not None else "n/a"
          print(f"{'avg R per trade':30s} {avg_b:>18s} {avg_f:>18s}")
          print("=" * 70)
          print()
          print(f"{len(removed)} trades removed by the filter (entry_time.hour in 21..22 UTC), "
                f"contributing {sum(r.r_multiple for r in removed if r.r_multiple is not None):.1f}R "
                f"combined to the WITHOUT-filter total above.")
          print()
          print("Removed trades (instrument, entry_time, r_multiple, status):")
          for r in sorted(removed, key=lambda r: r.entry_time):
              print(f"  {r.instrument:8s} {r.entry_time}  R={r.r_multiple}  {r.status}")
          PYEOF

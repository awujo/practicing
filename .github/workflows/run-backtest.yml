name: Run backtest

# On-demand backtest run, entirely on GitHub's infrastructure. Downloads
# the latest cached candle data published by fetch-data.yml, restores any
# previously published results (so the dashboard accumulates across runs
# instead of only ever showing the latest one), runs the Phase 5 engine
# for one instrument/entry-style, regenerates the results dashboard, and
# publishes it to GitHub Pages -- no local machine involved, and nothing
# to download to see the results.

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Internal symbol, e.g. EURUSD (see backtest/data_pipeline/instruments.py)"
        required: true
        default: "EURUSD"
      style:
        description: "Entry style"
        required: true
        default: "conservative"
        type: choice
        options:
          - aggressive
          - conservative

permissions:
  contents: write # needed to publish to the gh-pages branch

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backtest/data_pipeline/requirements.txt

      - name: Download latest data cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-latest --pattern 'backtest-data.tar.gz' --dir /tmp || {
            echo "::error::No 'data-latest' release found -- the data pipeline hasn't run yet. Go to Actions > Fetch backtest data > Run workflow, wait for it to finish, then re-run this workflow."
            exit 1
          }
          mkdir -p backtest/data
          tar -xzf /tmp/backtest-data.tar.gz -C backtest/
          echo "Restored $(find backtest/data -name '*.csv' | wc -l) cached data files."

      - name: Restore previously published results (if any)
        run: |
          mkdir -p backtest/results
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/ghpages origin/gh-pages
            if [ -d /tmp/ghpages/results ]; then
              cp /tmp/ghpages/results/*.csv backtest/results/ 2>/dev/null || true
              echo "Restored $(ls backtest/results | wc -l) previously published result file(s)."
            fi
            git worktree remove /tmp/ghpages --force
          else
            echo "No gh-pages branch yet -- this will be the first published run."
          fi

      - name: Run backtest
        run: |
          python -m backtest.engine.runner \
            --instrument "${{ inputs.instrument }}" \
            --style "${{ inputs.style }}"

      - name: Generate results dashboard
        run: python -m backtest.engine.report

      - name: Upload trade log (workflow artifact, for direct download too)
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ inputs.instrument }}-${{ inputs.style }}
          path: backtest/results/*.csv

      - name: Publish dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: backtest/site

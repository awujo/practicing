name: SLK live bias
# Hourly bias runner (no VPS). Needs repo secrets DATABASE_URL, TELEGRAM_BOT_TOKEN (chat id defaults to the owner, 1410229777)
# (optional DATABASE_CA = Aiven CA certificate, to verify the server). Without secrets it exits green.
# Candles: IC Markets cTrader (CTRADER_* secrets, one connection, last few days per pair); Dukascopy when cTrader
# fails or its secrets are missing (a ::warning:: annotation says so).
on:
  schedule:
    - cron: "7 * * * *"   # hourly, no Saturday (UTC) = FX closed; best effort: GitHub may start some minutes late
  workflow_dispatch:
    inputs:
      pairs: {description: "Comma list, empty = settings 'pairs' or all 28", default: ""}
      tick: {description: "1 = hourly tick from the Mini App server (/cron/tick): obeys FX hours like a scheduled run", default: "0"}
  push:
    branches: [claude-kevin-king]
    paths: ["slk/live.py"]
permissions:
  contents: read
concurrency: {group: slk-live, cancel-in-progress: false}  # shared with backfill.yml (same candle cache)
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # normal run 1-3 min; a lost candle cache is rebuilt from cTrader in ~1 min
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1410229777' }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
      CTRADER_ENV: demo
      SLK_CACHE: data
      SLK_STORE: data/store
    steps:
      - name: Check secrets and FX hours
        id: s
        run: |
          missing=""
          for v in DATABASE_URL TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::warning::Missing repo secrets:$missing. Add them in Settings > Secrets and variables > Actions. Skipping run."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Python checks the saved watchlists: FX pauses on weekends, Deriv continues.
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.s.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/live.yml
      - if: steps.s.outputs.ok == 'true'
        run: pip install -q pandas pymysql "protobuf>=3.20" requests websocket-client
      - name: Restore candle store
        if: steps.s.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: candles-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: candles-v3-  # cTrader store only (v2 = Dukascopy, never restored)
      - name: Apply db/schema.sql
        if: steps.s.outputs.ok == 'true'
        run: |
          python - <<'PY'
          import os, re, sys
          from slk import db
          try:
              db.apply_schema(); print("schema ok")
          except Exception as e:
              msg = re.sub(r"://[^@]*@", "://***@", f"{type(e).__name__}: {e}").replace(os.environ.get("DATABASE_URL", "") or "\0", "***")
              msg = msg.replace(os.environ.get("DATABASE_PASSWORD", "").strip() or "\0", "***")
              print(f"::error title=Database::{msg}")
              try:
                  p = db.parse_url(os.environ.get("DATABASE_URL", ""))
                  print(f"::error title=Parsed URL::user={p.get('user')} host={p.get('host')} port={p.get('port')} db={p.get('database')} password_length={len(p.get('password') or '')} pw_starts_AVNS={(p.get('password') or '').startswith('AVNS_')} pw_from_url={bool(__import__('urllib.parse').parse.urlparse(os.environ.get('DATABASE_URL','')).password)} separate_secret_length={len(os.environ.get('DATABASE_PASSWORD','').strip())} starts_mysql={os.environ.get('DATABASE_URL','').startswith('mysql://')}")
              except Exception as pe:
                  print(f"::error title=Parsed URL::{type(pe).__name__}: {pe}")
              sys.exit(1)
          PY
      - name: Run live bias
        id: runner
        timeout-minutes: 15
        if: steps.s.outputs.ok == 'true'
        env:
          PAIRS_IN: ${{ inputs.pairs }}
        run: |
          if [ -n "$PAIRS_IN" ]; then python -m slk.live --pairs "$PAIRS_IN"; else python -m slk.live; fi
      - name: Record interrupted run
        if: always() && steps.s.outputs.ok == 'true'
        env:
          RUN_ID: ${{ steps.runner.outputs.run_id }}
        run: |
          python - <<'PY'
          import os
          from slk import db
          if os.environ.get("RUN_ID"):
              db.execute("UPDATE runs SET finished_at=UTC_TIMESTAMP(), ok=0, note=%s WHERE id=%s AND finished_at IS NULL",
                         ("Runner interrupted or timed out; see GitHub Actions logs", int(os.environ["RUN_ID"])))
          # Shared concurrency ensures there is no other active live runner. Finalize any
          # tenant rows left unfinished by cancellation/timeout as well as the owner row.
          if db.query("SELECT COUNT(*) AS n FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='tenant_runs'")[0]["n"]:
              db.execute("UPDATE tenant_runs SET finished_at=UTC_TIMESTAMP(), ok=0, note=%s "
                         "WHERE job='live' AND finished_at IS NULL",
                         ("Runner interrupted or timed out; see GitHub Actions logs",))
          PY
      - name: Is the candle store complete?
        id: chk
        if: always()
        run: |
          if python -m slk.store --check --start 2018 --source ctrader; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Save candle store
        if: always() && steps.s.outputs.ok == 'true' && steps.chk.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/store
          key: candles-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Telegram alert on failure
        if: failure() || cancelled()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -sS -o /dev/null -w "telegram http %{http_code}\n" --max-time 20 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=SLK live run FAILED / INTERRUPTED $(date -u '+%Y-%m-%d %H:%M') UTC (${GITHUB_EVENT_NAME}). Log: ${RUN_URL}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true

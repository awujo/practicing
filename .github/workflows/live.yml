name: SLK live bias
# Hourly bias runner (no VPS). Needs repo secrets DATABASE_URL, TELEGRAM_BOT_TOKEN (chat id defaults to the owner, 1410229777)
# (optional DATABASE_CA = Aiven CA certificate, to verify the server). Without secrets it exits green.
on:
  schedule:
    - cron: "7 * * * 0-5"   # hourly, no Saturday (UTC) = FX closed; best effort: GitHub may start some minutes late
  workflow_dispatch:
    inputs:
      pairs: {description: "Comma list, empty = settings 'pairs' or all 28", default: ""}
  push:
    branches: [claude-kevin-king]
    paths: ["slk/live.py"]
permissions:
  contents: read
concurrency: {group: slk-live, cancel-in-progress: false}  # shared with backfill.yml (same candle cache)
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # normal run 1-3 min; a run that must rebuild a lost candle cache (no backfill) needs more
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_CA: ${{ secrets.DATABASE_CA }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1410229777' }}
      SLK_CACHE: data
      SLK_STORE: data/store
    steps:
      - name: Check secrets and FX hours
        id: s
        run: |
          missing=""
          for v in DATABASE_URL TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::warning::Missing repo secrets:$missing. Add them in Settings > Secrets and variables > Actions. Skipping run."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # FX weekend = Fri 17:00 -> Sun 17:00 New York. Scheduled runs then stop, except Fri 17:00-19:59 NY
          # (the final run: last bars + daily summary; slk/live.py runs it once per weekend).
          dow=$(TZ=America/New_York date +%u); hr=$(TZ=America/New_York date +%H); hr=$((10#$hr))
          closed=false
          { [ "$dow" = 5 ] && [ "$hr" -ge 20 ]; } && closed=true
          [ "$dow" = 6 ] && closed=true
          { [ "$dow" = 7 ] && [ "$hr" -lt 17 ]; } && closed=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$closed" = true ]; then
            echo "FX market closed (New York $(TZ=America/New_York date '+%a %H:%M')): nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.s.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/live.yml
      - if: steps.s.outputs.ok == 'true'
        run: pip install -q pandas pymysql
      - name: Restore candle store
        if: steps.s.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: candles-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: candles-v2-
      - name: Apply db/schema.sql
        if: steps.s.outputs.ok == 'true'
        run: |
          python - <<'PY'
          import os, re, sys
          from slk import db
          try:
              db.apply_schema(); print("schema ok")
          except Exception as e:
              msg = re.sub(r"://[^@]*@", "://***@", f"{type(e).__name__}: {e}").replace(os.environ.get("DATABASE_URL", "") or "\0", "***")
              msg = msg.replace(os.environ.get("DATABASE_PASSWORD", "").strip() or "\0", "***")
              print(f"::error title=Database::{msg}")
              try:
                  p = db.parse_url(os.environ.get("DATABASE_URL", ""))
                  print(f"::error title=Parsed URL::user={p.get('user')} host={p.get('host')} port={p.get('port')} db={p.get('database')} password_length={len(p.get('password') or '')} pw_starts_AVNS={(p.get('password') or '').startswith('AVNS_')} pw_from_url={bool(__import__('urllib.parse').parse.urlparse(os.environ.get('DATABASE_URL','')).password)} separate_secret_length={len(os.environ.get('DATABASE_PASSWORD','').strip())} starts_mysql={os.environ.get('DATABASE_URL','').startswith('mysql://')}")
              except Exception as pe:
                  print(f"::error title=Parsed URL::{type(pe).__name__}: {pe}")
              sys.exit(1)
          PY
      - name: Run live bias
        if: steps.s.outputs.ok == 'true'
        env:
          PAIRS_IN: ${{ inputs.pairs }}
        run: |
          if [ -n "$PAIRS_IN" ]; then python -m slk.live --pairs "$PAIRS_IN"; else python -m slk.live; fi
      - name: Is the candle store complete?
        id: chk
        if: always()
        run: |
          if python -m slk.store --check --start 2018; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Save candle store
        if: always() && steps.s.outputs.ok == 'true' && steps.chk.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/store
          key: candles-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Telegram alert on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -sS -o /dev/null -w "telegram http %{http_code}\n" --max-time 20 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=SLK live run FAILED $(date -u '+%Y-%m-%d %H:%M') UTC (${GITHUB_EVENT_NAME}). Log: ${RUN_URL}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true

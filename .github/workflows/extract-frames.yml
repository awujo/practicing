name: Extract course video frames

# Turns the videos in a release into contact sheets, committed back to
# the repo so they can actually be read.
#
# The videos live as release assets because they are too large for git
# (830MB for the Bishop set alone). They are downloaded here, framed, and
# thrown away -- only the sheets and the index are committed, which is a
# few MB rather than tens.
#
# Run it from the Actions tab: pick a release tag and, optionally, one
# video to do rather than all of them.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the videos"
        required: true
        default: "defi-bishop"
      only:
        description: "Substring to match one asset (blank = every video in the release)"
        required: false
        default: ""
      interval:
        description: "Seconds between frames (sheets mode)"
        required: false
        default: "15"
      mode:
        description: "sheets = contact sheets for skimming, frames = full-resolution stills"
        required: false
        default: "sheets"
        type: choice
        options: [sheets, frames]
      at:
        description: "frames mode only: comma-separated seconds, e.g. 705,750,765"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Extract frames
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ONLY: ${{ inputs.only }}
          INTERVAL: ${{ inputs.interval }}
          MODE: ${{ inputs.mode }}
          AT: ${{ inputs.at }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/videos

          # frames mode needs timestamps and a single video, or it either
          # does nothing or writes stills for nine videos at once.
          if [ "$MODE" = "frames" ]; then
            [ -n "$AT" ] || { echo "::error::frames mode needs 'at'"; exit 1; }
            [ -n "$ONLY" ] || { echo "::error::frames mode needs 'only' to pick one video"; exit 1; }
          fi

          # Asset names are the raw upload names, full of dots and
          # unsuitable as folder names. Map each to the transcript folder
          # that already exists for it, so frames land beside the words
          # rather than in a new naming scheme nobody else uses.
          map_name() {
            case "$1" in
              *Part.1.Bias.Entries*)        echo "bishop-bias-entries" ;;
              *Part.2.If.you.have.ever*)    echo "bishop-what-next" ;;
              *Repeating.a.system*)         echo "bishop-repeating-system" ;;
              *Part.2.TRADES.BREAKDOWN*)    echo "bishop-trades-breakdown-2" ;;
              *Part.3.TRADES.BREAKDOWN*)    echo "bishop-trades-breakdown-3" ;;
              *Part.5.Approach*)            echo "bishop-entries-part5" ;;
              *BUILDING.BIAS.PART.1*)       echo "bishop-building-bias-1" ;;
              *BUILDING.BIAS.PART.2*)       echo "bishop-building-bias-2" ;;
              *DAILY.ROUTINE*)              echo "bishop-daily-routine" ;;
              *)                            echo "" ;;
            esac
          }

          # Asset IDs, not name globs. `gh release download --pattern`
          # matches with filepath.Match, and these names -- dotted,
          # hyphenated, 90+ characters -- do not survive it: the 2026-09-19
          # run downloaded the first video fine and then died on the second
          # with "no assets match the file pattern", using a pattern copied
          # verbatim from the asset list. A numeric ID cannot be
          # misinterpreted.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | "\(.id)\t\(.name)"' > /tmp/assets.tsv

          failed=""
          seen=""
          # fd 3, not stdin: gh reads stdin, and a loop fed on stdin can
          # lose the rest of its input to a child process.
          while IFS=$'\t' read -r id asset <&3; do
            case "$asset" in *.mp4) ;; *) continue ;; esac
            [ -n "$ONLY" ] && case "$asset" in *"$ONLY"*) ;; *) continue ;; esac

            name="$(map_name "$asset")"
            if [ -z "$name" ]; then
              echo "::warning::no transcript folder mapped for $asset -- skipped"
              continue
            fi
            # Part 3 was uploaded twice under two names with identical
            # checksums; framing it twice would just overwrite itself.
            case " $seen " in *" $name "*) echo "skip duplicate: $asset"; continue ;; esac
            seen="$seen $name"

            transcript="knowledge-base/videos/$name/transcript.txt"
            if [ ! -f "$transcript" ]; then
              echo "::warning::$transcript missing -- skipped"
              continue
            fi

            # One video failing must not discard the others. The same
            # 2026-09-19 run framed a whole video and then threw it away,
            # because the job aborted before the commit step ever ran.
            echo "::group::$name"
            if gh api -H "Accept: application/octet-stream" \
                 "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "/tmp/videos/$name.mp4" \
               && python3 knowledge-base/tools/extract_frames.py "$MODE" \
                    --video "/tmp/videos/$name.mp4" \
                    --transcript "$transcript" \
                    --name "$name" --interval "$INTERVAL" --at "$AT"; then
              echo "ok: $name"
            else
              echo "::warning::$name FAILED -- continuing with the rest"
              failed="$failed $name"
            fi
            rm -f "/tmp/videos/$name.mp4"
            echo "::endgroup::"
          done 3< /tmp/assets.tsv

          echo "FAILED_VIDEOS=$failed" >> "$GITHUB_ENV"

      - name: Commit the sheets
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge-base/frames
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "Contact sheets for ${{ inputs.release_tag }} (every ${{ inputs.interval }}s)"
          git push

      - name: Fail if any video failed
        if: always()
        run: |
          if [ -n "${FAILED_VIDEOS// /}" ]; then
            echo "::error::these videos failed:${FAILED_VIDEOS}"
            exit 1
          fi

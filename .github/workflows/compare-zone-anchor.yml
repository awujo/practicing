name: Compare stop anchor (trigger_wick vs zone vs zone_entry)

# TEMPORARY, one-off A/B comparison -- removed once results are captured,
# same pattern as compare-rollover-filter.yml / compare-min-reward-filter.yml.
#
# Tests run_backtest()'s new stop_anchor="zone" against the
# long-standing "trigger_wick" default across all 25 live instruments,
# both entry styles, 2025-2026.
#
# READ THE OUTPUT CAREFULLY: this change alters the unit R is measured
# in. A correct (tighter) stop makes the same target worth more R, so
# total R can rise even if nothing about trade selection improved. Trade
# count, win rate, average R and median risk in pips all have to be read
# TOGETHER -- see OPERATIONS_LOG.md 2026-09-02. Median risk_pips is
# reported precisely so the R numbers can be interpreted rather than
# taken at face value.

on:
  workflow_dispatch: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backtest/data_pipeline/requirements.txt

      - name: Download latest data cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-latest --pattern 'backtest-data.tar.gz' --dir /tmp
          mkdir -p backtest/data
          tar -xzf /tmp/backtest-data.tar.gz -C backtest/
          echo "Restored $(find backtest/data -name '*.csv' | wc -l) cached data files."

      - name: Run the A/B comparison
        run: |
          python3 - <<'PYEOF'
          import statistics
          import pandas as pd
          from backtest.engine.runner import run_backtest
          from backtest.engine.trade_log import summarize

          INSTRUMENTS = [
              "EURUSD", "GBPUSD", "USDJPY", "USDCHF", "USDCAD", "AUDUSD", "NZDUSD",
              "EURGBP", "EURJPY", "EURCHF", "EURCAD", "EURNZD", "GBPJPY", "GBPCHF",
              "GBPCAD", "GBPNZD", "GBPAUD", "AUDCAD", "AUDJPY", "CHFJPY",
              "XAUUSD", "XAGUSD", "US30", "NAS100", "JP225",
          ]
          STYLES = ["conservative", "aggressive"]
          START = pd.Timestamp("2025-01-01", tz="UTC")
          END = pd.Timestamp("2026-12-31T23:59:59", tz="UTC")

          def run_all(anchor):
              out = []
              for instrument in INSTRUMENTS:
                  for style in STYLES:
                      try:
                          out.extend(run_backtest(
                              instrument, style, source="dukascopy",
                              start_date=START, end_date=END,
                              stop_anchor=anchor,
                          ))
                      except Exception as exc:
                          print(f"  [skip] {instrument}/{style}: {exc}")
              return out

          MODES = ["trigger_wick", "zone", "zone_entry"]
          results = {}
          for mode in MODES:
              print("Running stop_anchor=%r ..." % mode, flush=True)
              results[mode] = run_all(mode)

          def risk_stats(records):
              pips = [r.risk_pips for r in records if r.risk_pips]
              if not pips:
                  return (None, None, None)
              return (statistics.median(pips), min(pips), max(pips))

          def count_sub(records, t):
              return sum(1 for r in records if r.risk_pips and r.risk_pips < t)

          def count_over(records, t):
              return sum(1 for r in records if r.risk_pips and r.risk_pips > t)

          def cell(value):
              return str(value).rjust(20)

          stats = {m: summarize(results[m]) for m in MODES}
          risks = {m: risk_stats(results[m]) for m in MODES}
          base_n = stats["trigger_wick"]["total_trades"]

          def row(label, values):
              print(label.ljust(26) + "".join(cell(v) for v in values))

          width = 26 + 20 * len(MODES)
          print()
          print("=" * width)
          row("", MODES)
          row("total trades", [stats[m]["total_trades"] for m in MODES])
          row("closed trades", [stats[m]["closed_trades"] for m in MODES])
          row("wins", [stats[m]["wins"] for m in MODES])

          win_rates = []
          for m in MODES:
              wr = stats[m]["win_rate"]
              win_rates.append("n/a" if wr is None else "%.1f%%" % (wr * 100))
          row("win rate", win_rates)

          row("total R", ["%.1f" % stats[m]["total_r"] for m in MODES])

          avgs = []
          for m in MODES:
              a = stats[m]["avg_r"]
              avgs.append("n/a" if a is None else "%.3f" % a)
          row("avg R per trade", avgs)

          print("-" * width)
          for label, idx in (("median risk (pips)", 0), ("min risk (pips)", 1), ("max risk (pips)", 2)):
              vals = []
              for m in MODES:
                  v = risks[m][idx]
                  vals.append("n/a" if v is None else "%.1f" % v)
              row(label, vals)
          row("stops < 2 pips", [count_sub(results[m], 2) for m in MODES])
          row("stops > 30 pips", [count_over(results[m], 30) for m in MODES])
          row("setups skipped", [base_n - stats[m]["total_trades"] for m in MODES])
          print("=" * width)
          print()
          for m in MODES:
              kinds = {}
              for r in results[m]:
                  kinds[r.stop_kind] = kinds.get(r.stop_kind, 0) + 1
              print("%s stop_kind breakdown: %s" % (m, dict(sorted(kinds.items()))))
          PYEOF

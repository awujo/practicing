name: SLK backtest
on:
  push:
    branches: [claude-kevin-king]
    paths: ["slk/story.py", "slk/structure.py", "slk/levels.py", "slk/candles.py", "slk/entry.py", "slk/backtest.py", "slk/entry_backtest.py", "slk/store.py", "slk/leg_backtest.py", ".github/workflows/backtest.yml"]
  workflow_dispatch:
    inputs:
      pairs: {description: "Comma list, empty = all 28", default: ""}
      start: {default: "2018"}
      end: {default: "2025"}
      cfg: {description: "JSON overrides of slk/story.py DEFAULT", default: "{}"}
      entry_cfg: {description: "JSON overrides of slk/entry.py DEFAULT", default: "{}"}
permissions:
  contents: write
concurrency: {group: slk-backtest, cancel-in-progress: false}
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # cached candles + one process per CPU; a cold cache fetches 2018-2025 from cTrader (minutes)
    env:  # workflow inputs reach the scripts only through env (no shell injection)
      IN_START: ${{ inputs.start || '2018' }}
      IN_END: ${{ inputs.end || '2025' }}
      IN_PAIRS: ${{ inputs.pairs }}
      IN_CFG: ${{ inputs.cfg || '{}' }}
      IN_ENTRY_CFG: ${{ inputs.entry_cfg || '{}' }}
      SLK_STORE: data/store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: Restore candle store (same cTrader store as the live job / backfill)
        uses: actions/cache/restore@v4
        with:
          path: data/store
          key: candles-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: candles-v3-
      # a failing run turns the step red (the report is still committed below)
      - name: Backtest
        id: bt
        env:  # missing months come from IC Markets cTrader (Dukascopy fallback); refreshed tokens persist in the DB
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: demo
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA: ${{ secrets.DATABASE_CA }}
        run: |
          ARGS=(--start "$IN_START" --end "$IN_END" --out reports)
          [ -n "$IN_PAIRS" ] && ARGS+=(--pairs "$IN_PAIRS")
          mkdir -p reports
          set +e
          python -m slk.backtest "${ARGS[@]}" --cfg "$IN_CFG" --entry-cfg "$IN_ENTRY_CFG" --variants > reports/run.log 2>&1
          rc=$?
          echo "exit=$rc" >> reports/run.log
          tail -c 60000 reports/run.log >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Entry backtest
        if: ${{ !cancelled() && steps.bt.outcome != 'skipped' }}  # also after a failed story backtest
        env:  # missing months come from IC Markets cTrader (Dukascopy fallback); refreshed tokens persist in the DB
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: demo
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA: ${{ secrets.DATABASE_CA }}
        run: |
          ARGS=(--start "$IN_START" --end "$IN_END" --out reports)
          [ -n "$IN_PAIRS" ] && ARGS+=(--pairs "$IN_PAIRS")
          mkdir -p reports
          set +e
          python -m slk.entry_backtest "${ARGS[@]}" --cfg "$IN_CFG" --entry-cfg "$IN_ENTRY_CFG" --variants > reports/entry_run.log 2>&1
          rc=$?
          echo "exit=$rc" >> reports/entry_run.log
          tail -c 60000 reports/entry_run.log >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Leg backtest (structural stops; continuation after the target)
        if: ${{ !cancelled() && steps.bt.outcome != 'skipped' }}
        env:  # missing months come from IC Markets cTrader (Dukascopy fallback); refreshed tokens persist in the DB
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: demo
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA: ${{ secrets.DATABASE_CA }}
        run: |
          ARGS=(--start "$IN_START" --end "$IN_END" --out reports)
          [ -n "$IN_PAIRS" ] && ARGS+=(--pairs "$IN_PAIRS")
          set +e
          python -m slk.leg_backtest "${ARGS[@]}" > reports/leg_run.log 2>&1
          rc=$?
          echo "exit=$rc" >> reports/leg_run.log
          tail -c 30000 reports/leg_run.log >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Is the candle store complete?
        id: chk
        if: always()
        run: |
          if python -m slk.store --check --start 2018 --source ctrader; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Save candle store
        if: always() && steps.chk.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/store
          key: candles-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit report
        if: success() || failure()  # a cancelled run must not commit half a report
        run: |
          git config user.name "slk-backtest"; git config user.email "actions@github.com"
          git add reports
          git commit -m "Backtest report ($(date -u +%F))" || exit 0
          git pull --rebase -X theirs origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}

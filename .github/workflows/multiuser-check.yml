name: Multiuser isolation checks
on:
  workflow_dispatch:
  push:
    branches: [claude-kevin-king]
    paths: ['slk/tenancy.py', 'slk/db.py', 'slk/live.py', 'webapp/**', 'db/schema.sql', 'tests/test_multiuser_mysql.py', 'tests/test_tenancy.py', '.github/workflows/multiuser-check.yml']
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-test-only
          MYSQL_DATABASE: slk_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SLK_TEST_MYSQL: mysql://root:local-test-only@127.0.0.1:3306/slk_test?ssl-mode=DISABLED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest pandas pymysql fastapi httpx requests 'protobuf>=3.20'
      - run: python -m pytest -q tests/test_multiuser_mysql.py tests/test_tenancy.py tests/test_webapp.py tests/test_settings.py tests/test_live.py tests/test_continuation.py

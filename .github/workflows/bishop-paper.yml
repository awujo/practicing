name: Bishop offline paper import
on:
  workflow_dispatch:
    inputs:
      result_path:
        description: Committed local engine-result JSON path
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bishop-offline-paper-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local result path and persist paper snapshot
        env:
          RESULT_PATH: ${{ inputs.result_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from bishop.runner import main
          root = Path.cwd().resolve()
          path = (root / os.environ['RESULT_PATH']).resolve()
          if root not in path.parents or not path.is_file() or path.suffix != '.json':
              raise SystemExit('A repository-local JSON result is required')
          main(['--result', str(path), '--database', 'bishop-paper.sqlite'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bishop-offline-paper
          path: bishop-paper.sqlite

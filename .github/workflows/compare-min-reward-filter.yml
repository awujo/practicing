name: Compare minimum-reward entry filter

# TEMPORARY, one-off A/B comparison -- removed once results are captured,
# same pattern as compare-lookahead-fix.yml and compare-rollover-filter.yml
# earlier in this project's history.
#
# Direct question 2026-09-01: "a trade of less than 1R doesn't make sense
# to hold." Compares current behavior (every aligned setup is taken,
# regardless of how close the ERL-capped target sits) against skipping
# any entry whose target is less than 1R away, over the full 2025-2026
# history, all 25 live instruments x both entry styles.

on:
  workflow_dispatch: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backtest/data_pipeline/requirements.txt

      - name: Download latest data cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-latest --pattern 'backtest-data.tar.gz' --dir /tmp
          mkdir -p backtest/data
          tar -xzf /tmp/backtest-data.tar.gz -C backtest/
          echo "Restored $(find backtest/data -name '*.csv' | wc -l) cached data files."

      - name: Run the A/B comparison
        run: |
          python3 - <<'PYEOF'
          import pandas as pd
          from backtest.engine.runner import run_backtest
          from backtest.engine.trade_log import summarize

          INSTRUMENTS = [
              "EURUSD", "GBPUSD", "USDJPY", "USDCHF", "USDCAD", "AUDUSD", "NZDUSD",
              "EURGBP", "EURJPY", "EURCHF", "EURCAD", "EURNZD", "GBPJPY", "GBPCHF",
              "GBPCAD", "GBPNZD", "GBPAUD", "AUDCAD", "AUDJPY", "CHFJPY",
              "XAUUSD", "XAGUSD", "US30", "NAS100", "JP225",
          ]
          STYLES = ["conservative", "aggressive"]
          START = pd.Timestamp("2025-01-01", tz="UTC")
          END = pd.Timestamp("2026-12-31T23:59:59", tz="UTC")
          MIN_REWARD_R = 1.0

          def run_all(min_reward_r):
              all_records = []
              for instrument in INSTRUMENTS:
                  for style in STYLES:
                      try:
                          records = run_backtest(
                              instrument, style, source="dukascopy",
                              start_date=START, end_date=END,
                              min_reward_r=min_reward_r,
                          )
                      except Exception as exc:
                          print(f"  [skip] {instrument}/{style}: {exc}")
                          continue
                      all_records.extend(records)
              return all_records

          print("Running WITHOUT the min-reward filter (current default)...")
          baseline = run_all(None)
          print(f"Running WITH the min-reward filter (min_reward_r={MIN_REWARD_R})...")
          filtered = run_all(MIN_REWARD_R)

          base_stats = summarize(baseline)
          filt_stats = summarize(filtered)

          def reward_r(r):
              risk = abs(r.entry_price - r.stop_loss)
              return (abs(r.primary_target - r.entry_price) / risk) if risk else 0.0

          removed = [r for r in baseline if reward_r(r) < MIN_REWARD_R]

          print()
          print("=" * 70)
          print(f"{'':30s} {'WITHOUT filter':>18s} {'WITH filter':>18s}")
          print(f"{'total trades':30s} {base_stats['total_trades']:>18d} {filt_stats['total_trades']:>18d}")
          print(f"{'closed trades':30s} {base_stats['closed_trades']:>18d} {filt_stats['closed_trades']:>18d}")
          print(f"{'wins':30s} {base_stats['wins']:>18d} {filt_stats['wins']:>18d}")
          wr_b = f"{base_stats['win_rate']*100:.1f}%" if base_stats['win_rate'] is not None else "n/a"
          wr_f = f"{filt_stats['win_rate']*100:.1f}%" if filt_stats['win_rate'] is not None else "n/a"
          print(f"{'win rate':30s} {wr_b:>18s} {wr_f:>18s}")
          print(f"{'total R':30s} {base_stats['total_r']:>18.1f} {filt_stats['total_r']:>18.1f}")
          avg_b = f"{base_stats['avg_r']:.3f}" if base_stats['avg_r'] is not None else "n/a"
          avg_f = f"{filt_stats['avg_r']:.3f}" if filt_stats['avg_r'] is not None else "n/a"
          print(f"{'avg R per trade':30s} {avg_b:>18s} {avg_f:>18s}")
          print("=" * 70)
          print()
          removed_r = sum(r.r_multiple for r in removed if r.r_multiple is not None)
          print(f"{len(removed)} trades removed by the filter (target < {MIN_REWARD_R}R away), "
                f"contributing {removed_r:.1f}R combined to the WITHOUT-filter total above.")
          removed_wins = sum(1 for r in removed if r.status == "closed_win")
          removed_closed = sum(1 for r in removed if r.status in ("closed_win", "closed_loss", "closed_breakeven"))
          removed_wr = f"{removed_wins/removed_closed*100:.1f}%" if removed_closed else "n/a"
          print(f"Removed-trade win rate: {removed_wr} ({removed_wins}/{removed_closed})")
          PYEOF

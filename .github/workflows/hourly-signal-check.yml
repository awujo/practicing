name: Hourly signal check (Dukascopy reference)

# Runs right after every fetch-data.yml refresh and checks whether the
# strategy would have produced any entry signal in the last few hours --
# purely against Dukascopy data, entirely independent of MT5 and the
# live bots. This is the reference feed: if this finds a signal on some
# instrument/style and the corresponding live account's audit_log.db
# (bot/OPERATIONS_LOG.md has the current DB paths) has NO row anywhere
# near that entry_time, that's concrete evidence MT5 is still missing
# something -- even after the broker-clock-offset fix -- rather than the
# strategy just genuinely not finding a setup that hour.
#
# `since` is a 36-HOUR rolling window, not the 1-3 hours the "hourly"
# name suggests. Measured 2026-08-27, this workflow's upstream
# (fetch-data.yml, cron "0 * * * *") actually fired with gaps of 1.4h,
# 1.8h, 2.8h, 3.8h, 5.5h and 11.8h -- GitHub's `schedule` event is
# best-effort and gets heavily delayed under load. With the old 3-hour
# window, every signal inside that 11.8h gap was never published at
# all: the reference feed silently skipped ~9 hours of history while
# still presenting itself as ground truth for "did the bots miss
# anything".
#
# Widening costs nothing. check_recent_signals runs the full backtest
# per instrument regardless and then post-filters on entry_time, so the
# window is a display bound, not a work bound -- 36h is the same price
# as 1h and survives any delay we have actually observed.
#
# Consequence: the same signal reprints across many consecutive runs.
# That is expected. Treat this as "everything in the last day and a
# half", not a de-duplicated event stream.

permissions:
  contents: write # publishes the signal feed to the signal-feed branch

on:
  workflow_run:
    workflows: ["Fetch backtest data"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backtest/data_pipeline/requirements.txt

      - name: Download latest data cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-latest --pattern 'backtest-data.tar.gz' --dir /tmp || {
            echo "::error::No 'data-latest' release found -- run the fetch-data workflow first."
            exit 1
          }
          mkdir -p backtest/data
          tar -xzf /tmp/backtest-data.tar.gz -C backtest/

      - name: Run check (last 3 hours, both styles, all instruments)
        run: |
          SINCE=$(date -u -d '-36 hours' '+%Y-%m-%dT%H:%M:%S')
          {
            echo "## Hourly signal check -- since ${SINCE} UTC"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `|| true` so a partial failure still publishes the feed below
          # with its `errored` list populated -- the VPS consumer needs to
          # know which instruments it CAN'T speak for, and a workflow that
          # dies here would instead leave yesterday's file looking current.
          python -m backtest.engine.check_recent_signals --since "$SINCE" \
            --json /tmp/recent-signals.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Published as a branch rather than a release asset because the live
      # VPS already has working git credentials for this remote and no API
      # token -- `git fetch` + `git show` needs nothing new set up there.
      # The file is a few KB, and the branch is force-updated to a single
      # commit each run so it never accumulates history.
      - name: Publish the signal feed for the live VPS to reconcile against
        run: |
          test -f /tmp/recent-signals.json || {
            echo "::error::the check produced no feed file -- not publishing a stale one"
            exit 1
          }
          rm -rf /tmp/feed && mkdir /tmp/feed && cd /tmp/feed
          git init --quiet -b signal-feed
          cp /tmp/recent-signals.json recent-signals.json
          cat > README.md <<'EOF'
          Machine-generated by .github/workflows/hourly-signal-check.yml.

          `recent-signals.json` is the reference list of entry signals the
          strategy produced from Dukascopy data in the last rolling window.
          The live VPS reads it with `python -m bot.reconcile_signals` to
          check whether each one actually reached a live bot's audit
          database. Force-pushed every run; no history is kept here.
          EOF
          git add -A
          # Identity passed per-command rather than via `git config`: the
          # config would have to be set AFTER `git init` to land in this
          # throwaway repo, and setting it before (in the checkout) is a
          # silent no-op here that only surfaces as "empty ident name" at
          # commit time. -c can't be got wrong by reordering.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "signal feed $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push --quiet --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            signal-feed

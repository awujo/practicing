name: Transcribe video release

# Kevin King branch: for EVERY .mp4 in a release, transcribe it (faster-whisper)
# and cut contact sheets, one parallel job per video, then one commit.
# Videos are downloaded, processed and thrown away; only text + sheets are kept.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the videos"
        required: true
        default: "kevin_King"
      model:
        description: "faster-whisper model (tiny/base/small/medium)"
        required: false
        default: "small"
      interval:
        description: "Seconds between frames for contact sheets"
        required: false
        default: "15"

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          m=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '
            [.assets[] | select(.name|test("\\.mp4$"))
             | {id: .id, slug: ("kevin-" + (.name | ascii_downcase | sub("(\\.mp4)+$";"") | gsub("[^a-z0-9]+";"-") | sub("-+$";"")))}]')
          echo "$m"
          echo "matrix={\"include\":$(echo "$m" | jq -c .)}" >> "$GITHUB_OUTPUT"

  process:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    env:
      WHISPER_MODEL: ${{ inputs.model }}
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q faster-whisper
      - name: Download video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/video
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/${{ matrix.id }}" > /tmp/video/in.mp4
      - name: Transcribe
        run: |
          ffmpeg -y -loglevel error -i /tmp/video/in.mp4 -vn -ac 1 -ar 16000 -acodec pcm_s16le /tmp/video/audio.wav
          python .github/scripts/transcribe.py
          mkdir -p "knowledge-base/videos/$SLUG"
          cp /tmp/video/transcript.txt "knowledge-base/videos/$SLUG/transcript.txt"
      - name: Contact sheets
        run: |
          python3 knowledge-base/tools/extract_frames.py sheets \
            --video /tmp/video/in.mp4 \
            --transcript "knowledge-base/videos/$SLUG/transcript.txt" \
            --name "$SLUG" --interval "${{ inputs.interval }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: |
            knowledge-base/videos/${{ matrix.slug }}
            knowledge-base/frames/${{ matrix.slug }}

  commit:
    needs: process
    if: always() && needs.process.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: knowledge-base
          merge-multiple: true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge-base
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Kevin King transcripts + contact sheets (${{ inputs.release_tag }})"
          git pull --rebase && git push

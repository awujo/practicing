name: Transcribe video release

# On-demand transcription for a knowledge-base source video, entirely on
# GitHub's infrastructure. Given a release tag and an asset filename
# pattern (releases like defi-bishop hold MULTIPLE videos, so release_tag
# alone isn't enough to pick one), downloads the matching .mp4, extracts
# audio, transcribes with faster-whisper, and commits the raw transcript
# to knowledge-base/videos/<video_slug>/transcript.txt -- video_slug is
# separate from release_tag specifically so multiple videos sharing one
# release don't collide on the same output path.
#
# Runs here specifically because this Claude Code session's own network
# egress policy blocks huggingface.co (where faster-whisper's model
# weights live) -- the same class of restriction already documented for
# the Dukascopy data pipeline in backtest/README.md. A standard
# GitHub-hosted runner has normal internet access, so this is the
# reusable fix for every future video release too, not just a one-off.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the video asset (e.g. defi-bishop)"
        required: true
      asset_pattern:
        description: "Glob matching exactly one asset in the release (e.g. '*Part.1.Bias.Entries*')"
        required: false
        default: "*.mp4"
      video_slug:
        description: "Output folder name under knowledge-base/videos/ (e.g. bishop-bias-entries)"
        required: true
      model:
        description: "faster-whisper model size (tiny/base/small/medium/large-v3)"
        required: false
        default: "small"

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      ASSET_PATTERN: ${{ inputs.asset_pattern }}
      VIDEO_SLUG: ${{ inputs.video_slug }}
      WHISPER_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and faster-whisper
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install faster-whisper

      - name: Download video asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/video
          gh release download "$RELEASE_TAG" --pattern "$ASSET_PATTERN" --dir /tmp/video
          count=$(ls /tmp/video/*.mp4 | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::asset_pattern matched $count files, expected exactly 1 -- narrow the pattern"
            ls /tmp/video/*.mp4
            exit 1
          fi

      - name: Extract audio
        run: |
          f=$(ls /tmp/video/*.mp4 | head -1)
          ffmpeg -y -i "$f" -vn -ac 1 -ar 16000 -acodec pcm_s16le /tmp/video/audio.wav

      - name: Transcribe
        run: python .github/scripts/transcribe.py

      - name: Commit transcript
        run: |
          mkdir -p "knowledge-base/videos/$VIDEO_SLUG"
          cp /tmp/video/transcript.txt "knowledge-base/videos/$VIDEO_SLUG/transcript.txt"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "knowledge-base/videos/$VIDEO_SLUG/transcript.txt"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Add transcript for $VIDEO_SLUG"
          git pull --rebase && git push
